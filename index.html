<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windfall</title>
<style>
  :root { color-scheme: light dark; --bg: #EEF4FA; --fg: #1D2B44; --muted: #56647F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1630; --fg: #E4EEFF; --muted: #95A3BD; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 32rem; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>❄︎ Windfall</h1>
  <p>Windfall fa nevicare sopra le finestre del Mac.</p>
  <p>Questa pagina serve solo agli aggiornamenti: chi ha l'app la riceve aggiornata da sola.</p>
</main>
</body>
</html>

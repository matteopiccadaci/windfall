<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un regalo su Windfall</title>
<style>
  :root { color-scheme: light dark; --bg: #EEF4FA; --card: #FFFFFF; --fg: #1D2B44; --muted: #56647F; --accent: #C8323F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1630; --card: #16223F; --fg: #E4EEFF; --muted: #95A3BD; --accent: #E5505F; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; padding: 24px; }
  main { max-width: 30rem; background: var(--card); border-radius: 22px; padding: 28px; box-shadow: 0 20px 50px -30px rgba(10,20,48,.5); }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 .4rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  .biglietto { color: var(--fg); font-style: italic; border-left: 3px solid var(--accent); padding-left: 12px; }
  a.bottone { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
              padding: 12px 20px; border-radius: 999px; margin: .4rem 0 1rem; }
  .piccolo { font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1 id="titolo">🎁 Hai ricevuto un regalo</h1>
  <p id="cosa">Un regalo su Windfall.</p>
  <p id="nota" class="biglietto" hidden></p>
  <a id="apri" class="bottone" href="#">Apri in Windfall</a>
  <p class="piccolo">Si apre Windfall e il trenino porta il regalo sul tuo desktop. Se il Mac chiede se aprire Windfall, rispondi di sì.</p>
  <p class="piccolo">Non succede niente? Ti serve Windfall, aggiornato: chiedilo a chi ti ha mandato il regalo.</p>
</main>
<script>
  // I dati del regalo stanno dopo il # e non arrivano mai al server.
  const dati = location.hash.slice(1);
  const nomi = { pupazzo: "un pupazzo di neve", albero: "un albero di Natale", biglietto: "un biglietto" };
  function leggi(d) {
    try {
      let b = d.replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      const byte = Uint8Array.from(atob(b), c => c.charCodeAt(0));
      const r = JSON.parse(new TextDecoder().decode(byte));
      return r && r.v === 1 && nomi[r.k] ? r : null;
    } catch { return null; }
  }
  const regalo = dati ? leggi(dati) : null;
  const apri = document.getElementById("apri");
  if (regalo) {
    const chi = regalo.m ? regalo.m : "Un amico";
    document.getElementById("titolo").textContent = "🎁 " + chi + " ti ha mandato un regalo";
    document.getElementById("cosa").textContent = "Dentro c'è " + nomi[regalo.k] + ".";
    if (regalo.n) { const n = document.getElementById("nota"); n.textContent = "«" + regalo.n + "»"; n.hidden = false; }
    apri.href = "windfall://regalo?d=" + dati;
    setTimeout(() => { location.href = apri.href; }, 700);
  } else {
    document.getElementById("titolo").textContent = "Questo link non contiene un regalo";
    document.getElementById("cosa").textContent = "Forse è stato copiato a metà: chiedi di rimandartelo.";
    apri.hidden = true;
  }
</script>
</body>
</html>
